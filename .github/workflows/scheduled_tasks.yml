# .github/workflows/scheduled_tasks.yml

name: Scheduled Django Management Tasks

on:
  # Daily and Hourly jobs remain on the reliable built-in schedule
  schedule:
    - cron: '0 0 * * *'    # Daily: Cleanup
    - cron: '0 * * * *'    # Hourly: Reactivate and Reset
    
  # --- Trigger for the 1-minute reminders (triggered externally) ---
  repository_dispatch:
    types: [minute_reminder_trigger]

jobs:
  # --- Periodic Jobs (TRIGGERED BY REPOSITORY_DISPATCH - RUNS EVERY MINUTE) ---
  periodic_reminders:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'minute_reminder_trigger'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Set up Python with built-in caching (FIXED: Handles cache path automatically)
      - name: Set up Python and Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip' # Enables caching for the pip dependency cache
          cache-dependency-path: 'requirements.txt' # Key is based on this file
      
      # 2. Install Dependencies (Runs quickly if cache is hit)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Periodic Reminder Commands (Every Minute via External Cron)
        env:
          # --- ESSENTIAL DJANGO/DB SECRETS ---
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # --- EMAIL SECRETS ---
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
        run: |
          echo "Starting periodic reminders (External Dispatch)..."
          python manage.py send_task_reminders
          python manage.py send_ai_subtask_reminders
          python manage.py send_daily_activity_reminders
          python manage.py send_pending_verifications
          
  # ----------------------------------------------------------------------------------
  
  # --- Hourly Jobs (0 * * * *) - UPDATED FOR CACHING ---
  hourly_tasks:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 * * * *'

    steps:
      - uses: actions/checkout@v4
      
      # 1. Set up Python with built-in caching (FIXED)
      - name: Set up Python and Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      # 2. Install Dependencies (Runs quickly if cache is hit)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Commands
        env:
          # --- ESSENTIAL DJANGO/DB SECRETS ---
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # --- EMAIL SECRETS ---
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |
          echo "Starting hourly tasks..."
          python manage.py reactivate_routines
          python manage.py reset_daily_activity_reminders
          
  # ----------------------------------------------------------------------------------

  # --- Daily Job (0 0 * * *) - UPDATED FOR CACHING ---
  daily_cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'

    steps:
      - uses: actions/checkout@v4
      
      # 1. Set up Python with built-in caching (FIXED)
      - name: Set up Python and Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      # 2. Install Dependencies (Runs quickly if cache is hit)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Cleanup Command
        env:
          # --- ESSENTIAL DJANGO/DB SECRETS ---
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # --- EMAIL SECRETS ---
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
        run: |
          echo "Starting daily cleanup..."
          python manage.py cleanup_notifications
