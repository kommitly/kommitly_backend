# .github/workflows/scheduled_tasks.yml

name: Scheduled Django Management Tasks

on:
  # Daily and Hourly jobs remain on the reliable built-in schedule
  schedule:
    - cron: '0 0 * * *'    # Daily: Cleanup (0 0 * * *)
    - cron: '0 * * * *'    # Hourly: Reactivate and Reset (0 * * * *)
    
  # --- New trigger for the 1-minute reminders (triggered externally) ---
  repository_dispatch:
    types: [minute_reminder_trigger] # This event name must match the API payload sent by cron-job.org

jobs:
  # --- Periodic Jobs (TRIGGERED BY REPOSITORY_DISPATCH - RUNS EVERY MINUTE) ---
  periodic_reminders:
    runs-on: ubuntu-latest
    # CRUCIAL CHANGE: The 'if' condition now checks for the repository_dispatch event type.
    if: github.event_name == 'repository_dispatch' && github.event.action == 'minute_reminder_trigger'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Set up Python with an output for the cache directory
      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python # Added ID to reference in cache
        with:
          python-version: '3.12.3'
      
      # 2. Use Cache for Dependencies
      - name: Cache Python Dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: ${{ steps.setup-python.outputs.cache-path }}
          # The key changes only if requirements.txt changes, forcing a rebuild
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      # 3. Install Dependencies ONLY if the cache misses (install-dependencies job)
      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Periodic Reminder Commands (Every Minute via External Cron)
        env:
          # --- SECRETS --- (List remains the same)
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
        run: |
          echo "Starting periodic reminders (External Dispatch)..."
          # Now it jumps straight to running the tasks
          python manage.py send_task_reminders
          python manage.py send_ai_subtask_reminders
          python manage.py send_daily_activity_reminders
          
  # ----------------------------------------------------------------------------------
  
  # --- Hourly Jobs (0 * * * *) - Also updated for caching ---
  hourly_tasks:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 * * * *'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python-hourly
        with:
          python-version: '3.12.3'
          
      - name: Cache Python Dependencies
        uses: actions/cache@v4
        id: cache-deps-hourly
        with:
          path: ${{ steps.setup-python-hourly.outputs.cache-path }}
          key: ${{ runner.os }}-python-${{ steps.setup-python-hourly.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          
      - name: Install Dependencies
        if: steps.cache-deps-hourly.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Commands
        env:
          # --- SECRETS --- (List remains the same)
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |
          echo "Starting hourly tasks..."
          python manage.py reactivate_routines
          python manage.py reset_daily_activity_reminders
          
  # ----------------------------------------------------------------------------------

  # --- Daily Job (0 0 * * *) - Also updated for caching ---
  daily_cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python-daily
        with:
          python-version: '3.12.3'
          
      - name: Cache Python Dependencies
        uses: actions/cache@v4
        id: cache-deps-daily
        with:
          path: ${{ steps.setup-python-daily.outputs.cache-path }}
          key: ${{ runner.os }}-python-${{ steps.setup-python-daily.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          
      - name: Install Dependencies
        if: steps.cache-deps-daily.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Cleanup Command
        env:
          # --- SECRETS --- (List remains the same)
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
        run: |
          echo "Starting daily cleanup..."
          python manage.py cleanup_notifications
