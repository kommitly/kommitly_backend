<!DOCTYPE html>
<html>
<head>
    <style>
        .button {
          
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #F4F1FF;
          
            padding: 20px;
            
           
        }
    </style>
</head>
<body>
    <h2>Hi <span style="color: #4F378A;">{{ user.first_name }} 👋</span>,</h2>
    <p>This is a friendly reminder that your task <span style="background-color: #D6CFFF; color: #4F378A; border-radius: 4px; padding-top: 5px; padding-bottom: 5px; padding-left: 10px; padding-right: 10px;"><strong>{{ ai_task.title }}</strong></span> is due soon.</p>

    <p style="margin-bottom: 30px; margin-top: 30px;">
        <a href="{{ app_link }}" class="button" style="background-color: #4F378A; color: #F4F1FF; font-weight: 100; border-radius: 10px; 
        box-shadow: inset 0px 4px 4px rgba(43, 24, 89, 0.15),
                    -8px 0px 12px rgba(43, 24, 89, 0.10),
                    0px 8px 12px rgba(43, 24, 89, 0.50);">
        View task
      </a>
       </p>

    <p style="font-size: small; color: #4F378A;">Stay committed! 💪<br><span style="font-size:small; font-weight: 800; color: #2C2640;">The Kommitly Team</span></p>
</body>
</html>
